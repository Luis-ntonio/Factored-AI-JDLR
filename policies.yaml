#       prueba sería una regla no verificable. Se difiere hasta que exista
#       necesidad de negocio concreta.
#   (c) Correlación: CONFIRMADA igual que para eligibility — misma tabla real
#       `banking-agent-dev-case-store`, misma partición
#       `pk = CASE#<caseId>`, `sk = RESULT#dispute#<turnId>`,
